name: Plugin Weekly Release

on:
  workflow_call:
    inputs:
      plugin_name:
        description: "Name of the plugin (e.g., flashcards)"
        required: true
        type: string
    secrets:
      RIMORI_TOKEN:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
      PAT_TOKEN:
        required: true

env:
  SLACK_CHANNEL_ID: C09FDPQ8XPB
  SLACK_PR_CHANNEL_ID: C09VCT4JFU4

jobs:
  # IMPORTANT: No code change detection should be done here because the rimori packages change frequently and new changes should be released weekly.

  lint-build-test:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          pnpm install
          pnpm update @rimori/playwright-testing @rimori/client @rimori/react-client --latest

      - name: Print dependency versions
        run: |
          echo "=== Installed Package Versions ==="
          pnpm list @rimori/client @rimori/react-client @rimori/playwright-testing --depth=0 || echo 'Some packages not installed'
          echo "=================================="

      - name: TypeScript check
        run: pnpm check

      - name: Build worker
        run: pnpm build:worker

      - name: Build application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run scenario tests
        run: pnpm exec playwright test '\.test\.ts$'
        env:
          RIMORI_TOKEN: ${{ secrets.RIMORI_TOKEN }}

      - name: Upload scenario test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scenario-test-results
          path: test-results/
          retention-days: 7

      - name: Fail Slack Notification
        if: failure()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "❌ ${{ inputs.plugin_name }} Plugin Weekly Release: Build or Tests Failed"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "❌ Build/Tests Failed"
              - type: section
                text:
                  type: mrkdwn
                  text: "Check the workflow run for details: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"

  prepare-release:
    name: Prepare Weekly Release
    needs: [lint-build-test]
    if: needs.lint-build-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Fetch branches
        run: |
          git fetch origin dev
          git fetch origin main

      - name: Create release branch
        id: branch
        run: |
          DATE=$(date +%Y-%m-%d)
          RELEASE_BRANCH="release/weekly-${DATE}"
          git checkout dev
          git pull origin dev
          git checkout -b "$RELEASE_BRANCH"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV

      - name: Bump version and update lockfile
        id: version
        run: |
          # Get current version from main (just to read it)
          git checkout main
          git pull origin main
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Switch to release branch to make changes there
          git checkout ${{ env.RELEASE_BRANCH }}

          # Bump version on release branch
          npm version $NEW_VERSION --no-git-tag-version

          # Sync lockfile with updated package.json version
          echo "Syncing pnpm-lock.yaml with new version..."
          pnpm install

          # Upgrade Rimori packages to latest versions
          echo "Upgrading Rimori packages to latest versions..."
          pnpm update @rimori/playwright-testing @rimori/client @rimori/react-client --latest

          # Commit version bump and lockfile
          git add package.json
          [ -f pnpm-lock.yaml ] && git add pnpm-lock.yaml
          git commit -m "chore: bump version to $NEW_VERSION and update lockfile"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        run: |
          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }} - ${{ inputs.plugin_name }} plugin"

      - name: Push release branch
        run: git push origin ${{ env.RELEASE_BRANCH }}

      - name: Push git tag
        run: git push origin "v${{ env.NEW_VERSION }}"

      - name: Generate Changelog
        id: changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git checkout dev
          CHANGELOG=$(node scripts/generate-weekly-changelog.cjs)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pull Request via GitHub API
        id: create_pr
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          API_JSON=$(jq -n \
            --arg title "Weekly Release: ${{ inputs.plugin_name }} Plugin - $NEW_VERSION" \
            --arg head "${{ env.RELEASE_BRANCH }}" \
            --arg base "main" \
            --arg body "## Weekly Release: ${{ inputs.plugin_name }} Plugin - $NEW_VERSION\n\n$CHANGELOG\n\nAutomated PR via CI." \
            '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}')

          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls \
            -d "$API_JSON")

          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r .number)
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "Created PR #$PR_NUMBER"

      - name: Notify Slack for PR Approval
        if: success() && env.PR_NUMBER != 'null'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_PR_CHANNEL_ID }}
            text: "${{ inputs.plugin_name }} - v${{ env.NEW_VERSION }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "${{ inputs.plugin_name }} - v${{ env.NEW_VERSION }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "<${{ github.server_url }}/${{ github.repository }}/pull/${{ env.PR_NUMBER }}|View PR>"

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            text: "❌ ${{ inputs.plugin_name }} Plugin Weekly Release Preparation Failed"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "❌ Weekly Release Preparation Failed"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Plugin:*\n${{ inputs.plugin_name }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
